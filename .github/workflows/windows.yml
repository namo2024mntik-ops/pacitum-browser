name: Build Windows EXE
on: [push, workflow_dispatch]
permissions:
  contents: write   # tag builds attach the installer + .sha256 to an existing release (updater feed)
jobs:
  build:
    runs-on: windows-latest
    # Two release lines from one source: Qt 6.11 -> Pacitum 1.9.x, Qt 6.8 LTS -> 1.8.x "legacy"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: main,   qt: '6.11.*' }
          - { line: legacy, qt: '6.8.*' }
    name: build (${{ matrix.line }}, Qt ${{ matrix.qt }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtserialport qtconnectivity'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        env:   # Google sync OAuth client (repo secrets; empty = users paste their own in Settings)
          GOOGLE_ID: ${{ secrets.PACITUM_GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.PACITUM_GOOGLE_CLIENT_SECRET }}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DPACITUM_GOOGLE_CLIENT_ID=$env:GOOGLE_ID" "-DPACITUM_GOOGLE_CLIENT_SECRET=$env:GOOGLE_SECRET"
          cmake --build build --config Release
          "PACITUM_VERSION=$(Get-Content build/pacitum-version.txt)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter PacitumBrowser.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/
          # 1.8.9 updater: the small helper that shows "Installing update…" while Setup runs
          Copy-Item (Get-ChildItem build -Recurse -Filter PacitumUpdateHelper.exe | Select-Object -First 1).FullName dist/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-quick-import --skip-plugin-types qmltooling,generic,networkinformation,position,sqldrivers dist/PacitumBrowser.exe
          # keep the SQLite driver only; drop unused image formats
          # (qtwebengine_devtools_resources.pak stays: without it Developer tools opens blank)
          New-Item -ItemType Directory -Force dist/sqldrivers | Out-Null
          Copy-Item "$env:QT_ROOT_DIR/plugins/sqldrivers/qsqlite.dll" dist/sqldrivers/
          Get-ChildItem dist/imageformats -Filter *.dll | Where-Object { $_.Name -notmatch '^(qsvg|qico|qjpeg|qgif)\.dll$' } | Remove-Item -Force
          Get-ChildItem dist -Recurse -Filter *.pdb | Remove-Item -Force
          "{0:N1} MB in dist" -f ((Get-ChildItem dist -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          if (Test-Path "$env:VCToolsRedistDir\x64") { Get-ChildItem "$env:VCToolsRedistDir\x64" -Recurse -Filter *.dll | Where-Object { $_.FullName -match 'CRT' } | Copy-Item -Destination dist }
      - name: Smoke test (exe starts and shows a window)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\Pacitum\Pacitum Browser"
          $p = Start-Process dist\PacitumBrowser.exe -ArgumentList '--smoke-test' -PassThru
          # Poll for the window instead of a fixed 6 s sleep: cold runners sometimes need ~8 s
          # (QtWebEngine init) and the old check failed although the app reported SMOKE OK.
          $hwnd = 0; $alive = $true
          for ($i = 0; $i -lt 50; $i++) {
            Start-Sleep -Milliseconds 500; $p.Refresh()
            if ($p.HasExited) { $alive = $false; break }
            if ($p.MainWindowHandle -ne 0) { $hwnd = $p.MainWindowHandle; break }
          }
          Start-Sleep -Seconds 3   # let the first page paint before the screenshot
          Write-Host "alive=$alive MainWindowHandle=$hwnd title='$($p.MainWindowTitle)'"
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          New-Item -ItemType Directory -Force smoke | Out-Null
          $bmp.Save("$PWD\smoke\desktop.png"); $g.Dispose(); $bmp.Dispose()
          if (-not $p.WaitForExit(30000)) { Write-Host "still running after smoke window; killing"; $p.Kill() }
          Write-Host "exit code: $($p.ExitCode)"
          Copy-Item "$log\startup.log","$log\crash.log" smoke\ -ErrorAction SilentlyContinue
          Get-Content smoke\startup.log -ErrorAction SilentlyContinue | Select-Object -Last 60
          Get-Content smoke\crash.log -ErrorAction SilentlyContinue
          Get-ChildItem dist -Name | Out-File smoke\dist-files.txt
          Get-ChildItem dist -Recurse -Name | Out-File -Append smoke\dist-files.txt
          $tl = Get-Content smoke\startup.log -ErrorAction SilentlyContinue | Select-String 'time-to-window|time-to-first-paint|time-to-first-page'
          "startup timing: $($tl -join ' | ')" | Tee-Object smoke\timing.txt
          if (-not $alive -or $hwnd -eq 0 -or $p.ExitCode -ne 0) { Write-Error "SMOKE TEST FAILED"; exit 1 }
      - name: Resize test (Qt resize, SetWindowPos, live drag, maximize/restore)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\Pacitum\Pacitum Browser"
          Remove-Item "$log\crash.log" -ErrorAction SilentlyContinue
          $p = Start-Process dist\PacitumBrowser.exe -ArgumentList '--resize-test',"$PWD\tests\resize-test.html" -PassThru
          if (-not $p.WaitForExit(150000)) { Write-Host "resize test hung; killing"; $p.Kill(); $p.WaitForExit() }
          New-Item -ItemType Directory -Force resize | Out-Null
          Copy-Item "$log\startup.log" resize\startup.log -ErrorAction SilentlyContinue
          Copy-Item "$log\crash.log" resize\crash.log -ErrorAction SilentlyContinue
          Copy-Item "$log\resize-shots" resize\shots -Recurse -ErrorAction SilentlyContinue
          Get-Content resize\startup.log -ErrorAction SilentlyContinue | Select-String 'RESIZE|frame margins|WARN|CRITICAL' | ForEach-Object { $_.Line }
          Write-Host "exit code: $($p.ExitCode)"
          $ok = Select-String -Path resize\startup.log -Pattern 'RESIZE OK' -Quiet
          if ($p.ExitCode -ne 0 -or -not $ok -or (Test-Path resize\crash.log)) { Write-Error "RESIZE TEST FAILED"; exit 1 }
      - uses: actions/upload-artifact@v7.0.2
        if: failure()   # logs/screens only when a test fails (keeps Actions storage small)
        with: { name: "resize-test-${{ matrix.line }}", path: resize/, if-no-files-found: ignore, retention-days: 1 }
      - name: Profile test (migration, registry, isolation, guest)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\Pacitum\Pacitum Browser"
          Remove-Item "$log\crash.log" -ErrorAction SilentlyContinue
          $p = Start-Process dist\PacitumBrowser.exe -ArgumentList '--profile-test' -PassThru
          if (-not $p.WaitForExit(120000)) { Write-Host "profile test hung; killing"; $p.Kill(); $p.WaitForExit() }
          New-Item -ItemType Directory -Force profiles | Out-Null
          Copy-Item "$log\startup.log" profiles\startup.log -ErrorAction SilentlyContinue
          Copy-Item "$log\crash.log" profiles\crash.log -ErrorAction SilentlyContinue
          Get-Content profiles\startup.log -ErrorAction SilentlyContinue | Select-String 'PROFILES|profile test|WARN|CRITICAL' | ForEach-Object { $_.Line }
          Write-Host "exit code: $($p.ExitCode)"
          $ok = Select-String -Path profiles\startup.log -Pattern 'PROFILES OK' -Quiet
          if ($p.ExitCode -ne 0 -or -not $ok -or (Test-Path profiles\crash.log)) { Write-Error "PROFILE TEST FAILED"; exit 1 }
      - uses: actions/upload-artifact@v7.0.2
        if: failure()   # logs/screens only when a test fails (keeps Actions storage small)
        with: { name: "profile-test-${{ matrix.line }}", path: profiles/, if-no-files-found: ignore, retention-days: 1 }
      - name: Permissions test (store, shims, bridge, prompts, popups, downloads)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\Pacitum\Pacitum Browser"
          Remove-Item "$log\crash.log" -ErrorAction SilentlyContinue
          $env:PACITUM_PERM_SHOTS = "$PWD\permissions"
          New-Item -ItemType Directory -Force permissions | Out-Null
          $p = Start-Process dist\PacitumBrowser.exe -ArgumentList '--permissions-test' -PassThru
          if (-not $p.WaitForExit(180000)) { Write-Host "permissions test hung; killing"; $p.Kill(); $p.WaitForExit() }
          Copy-Item "$log\startup.log" permissions\startup.log -ErrorAction SilentlyContinue
          Copy-Item "$log\crash.log" permissions\crash.log -ErrorAction SilentlyContinue
          Get-Content permissions\startup.log -ErrorAction SilentlyContinue | Select-String 'PERM|perm test|FAIL|WARN|CRITICAL' | ForEach-Object { $_.Line }
          Write-Host "exit code: $($p.ExitCode)"
          $ok = Select-String -Path permissions\startup.log -Pattern 'PERMISSIONS OK' -Quiet
          if ($p.ExitCode -ne 0 -or -not $ok -or (Test-Path permissions\crash.log)) { Write-Error "PERMISSIONS TEST FAILED"; exit 1 }
      - uses: actions/upload-artifact@v7.0.2
        if: failure()   # logs/screens only when a test fails (keeps Actions storage small)
        with: { name: "permissions-test-${{ matrix.line }}", path: permissions/, if-no-files-found: ignore, retention-days: 1 }
      - name: Stress test (tabs, switching, fullscreen, loads)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\Pacitum\Pacitum Browser"
          Remove-Item "$log\crash.log" -ErrorAction SilentlyContinue
          $p = Start-Process dist\PacitumBrowser.exe -ArgumentList '--stress-test' -PassThru
          if (-not $p.WaitForExit(180000)) { Write-Host "stress test hung; killing"; $p.Kill(); $p.WaitForExit() }
          New-Item -ItemType Directory -Force stress | Out-Null
          Copy-Item "$log\startup.log" stress\startup.log -ErrorAction SilentlyContinue
          Copy-Item "$log\crash.log" stress\crash.log -ErrorAction SilentlyContinue
          Get-Content stress\startup.log -ErrorAction SilentlyContinue | Where-Object { $_ -notmatch 'user gesture' } | Select-Object -Last 25
          Get-Content stress\crash.log -ErrorAction SilentlyContinue
          Write-Host "exit code: $($p.ExitCode)"
          $ok = Select-String -Path stress\startup.log -Pattern 'STRESS OK' -Quiet
          if ($p.ExitCode -ne 0 -or -not $ok -or (Test-Path stress\crash.log)) { Write-Error "STRESS TEST FAILED"; exit 1 }
      - uses: actions/upload-artifact@v7.0.2
        if: failure()   # logs/screens only when a test fails (keeps Actions storage small)
        with: { name: "stress-test-${{ matrix.line }}", path: stress/, if-no-files-found: ignore, retention-days: 1 }
      - name: Single-instance handoff test (second launch passes its URL to the running window)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\Pacitum\Pacitum Browser"
          Remove-Item "$log\crash.log","$log\handoff.log" -ErrorAction SilentlyContinue
          $p = Start-Process dist\PacitumBrowser.exe -ArgumentList '--handoff-test',"$PWD\tests\resize-test.html" -PassThru
          if (-not $p.WaitForExit(120000)) { Write-Host "handoff test hung; killing"; $p.Kill(); $p.WaitForExit() }
          New-Item -ItemType Directory -Force handoff | Out-Null
          Copy-Item "$log\startup.log","$log\handoff.log","$log\crash.log" handoff\ -ErrorAction SilentlyContinue
          Get-Content handoff\startup.log -ErrorAction SilentlyContinue | Select-String 'HANDOFF|handoff|WARN|CRITICAL' | ForEach-Object { $_.Line }
          Get-Content handoff\handoff.log -ErrorAction SilentlyContinue
          Write-Host "exit code: $($p.ExitCode)"
          $ok = Select-String -Path handoff\startup.log -Pattern 'HANDOFF OK' -Quiet
          if ($p.ExitCode -ne 0 -or -not $ok -or (Test-Path handoff\crash.log)) { Write-Error "HANDOFF TEST FAILED"; exit 1 }
      - name: Perf test (RSS with 13 tabs, tab switching, CPU while minimized)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\Pacitum\Pacitum Browser"
          Remove-Item "$log\crash.log" -ErrorAction SilentlyContinue
          $p = Start-Process dist\PacitumBrowser.exe -ArgumentList '--perf-test' -PassThru
          if (-not $p.WaitForExit(150000)) { Write-Host "perf test hung; killing"; $p.Kill(); $p.WaitForExit() }
          New-Item -ItemType Directory -Force perf | Out-Null
          Copy-Item "$log\startup.log","$log\crash.log" perf\ -ErrorAction SilentlyContinue
          Get-Content perf\startup.log -ErrorAction SilentlyContinue | Select-String 'PERF|time-to|first page' | ForEach-Object { $_.Line } | Tee-Object perf\numbers.txt
          Write-Host "exit code: $($p.ExitCode)"
          $ok = Select-String -Path perf\startup.log -Pattern 'PERF OK' -Quiet
          if ($p.ExitCode -ne 0 -or -not $ok -or (Test-Path perf\crash.log)) { Write-Error "PERF TEST FAILED"; exit 1 }
      - uses: actions/upload-artifact@v7.0.2
        if: failure()   # logs/screens only when a test fails (keeps Actions storage small)
        with: { name: "handoff-perf-test-${{ matrix.line }}", path: "handoff/\nperf/", if-no-files-found: ignore, retention-days: 1 }
      - uses: actions/upload-artifact@v7.0.2
        if: failure()   # logs/screens only when a test fails (keeps Actions storage small)
        with: { name: "smoke-test-${{ matrix.line }}", path: smoke/, if-no-files-found: ignore, retention-days: 1 }
      - name: Installer
        shell: pwsh
        run: |
          # pinned: installer.iss needs 6.6+ (dynamic dark images, PNG wizard images, zircon style)
          choco install innosetup --version 6.7.1 -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVer=$env:PACITUM_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # SHA256 next to the installer ("<hash>  <file>", sha256sum format): the built-in updater
          # verifies the download against the "<installer>.exe.sha256" release asset.
          Get-ChildItem installer -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Set-Content -NoNewline -Encoding ascii "$($_.FullName).sha256"
            Write-Host "$h  $($_.Name)  $($_.Length) bytes"
          }
      - name: Attach installer + SHA256 to the release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # each tag gets the installer of its own line only (v1.9.x <- Qt 6.11 build, v1.8.x <- legacy build)
          if ("${{ github.ref_name }}" -ne "v$env:PACITUM_VERSION") { Write-Host "tag ${{ github.ref_name }} is not this build (v$env:PACITUM_VERSION); skipping"; exit 0 }
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) { Write-Host "no release for ${{ github.ref_name }} yet; skipping upload"; exit 0 }
          gh release upload "${{ github.ref_name }}" (Get-ChildItem installer -File).FullName --clobber --repo "${{ github.repository }}"
      - name: Installer pages + in-place upgrade check
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 12
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          New-Item -ItemType Directory -Force installer-shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\installer-shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $setup = (Get-ChildItem installer -Filter *.exe | Select-Object -First 1).FullName
          $ws = New-Object -ComObject WScript.Shell
          # AppActivate can fail while the runner console holds the foreground; SendKeys then goes
          # to the console and the wizard stalls (seen on the location page in 1.5.1). Retry until
          # the wizard is in front, and confirm each page change below.
          function Key($k) {
            for ($t = 0; $t -lt 10 -and -not $ws.AppActivate('Setup - Pacitum Browser'); $t++) { Start-Sleep -Milliseconds 300 }
            Start-Sleep -Milliseconds 300; $ws.SendKeys($k)
          }
          $appDir = "$env:LOCALAPPDATA\Programs\Pacitum Browser"
          # 1) interactive per-user install, screenshot every page
          $p = Start-Process $setup -ArgumentList '/CURRENTUSER' -PassThru
          Start-Sleep 5; Shot '1-welcome'
          Key '{ENTER}'; Start-Sleep 3; Shot '2-location'
          # location page -> Install: press Enter until Setup has started writing files (max 5 tries)
          for ($t = 0; $t -lt 5; $t++) {
            Key '{ENTER}'
            for ($w = 0; $w -lt 8 -and -not (Test-Path $appDir); $w++) { Start-Sleep -Milliseconds 250 }
            if (Test-Path $appDir) { break }
            Write-Host "location page: Enter #$($t+1) didn't start the install; retrying"
          }
          Start-Sleep -Milliseconds 300; Shot '3-progress'
          for ($i = 0; $i -lt 90 -and -not (Test-Path "$env:LOCALAPPDATA\Programs\Pacitum Browser\unins000.exe"); $i++) { Start-Sleep 1 }
          Start-Sleep 4; Shot '4-finish'
          Key ' '; Start-Sleep 1; Key '{ENTER}'     # untick "Launch", Finish
          $p.WaitForExit(30000) | Out-Null
          Get-Process PacitumBrowser -ErrorAction SilentlyContinue | Stop-Process -Force
          $first = (Get-Item "$env:LOCALAPPDATA\Programs\Pacitum Browser\PacitumBrowser.exe" -ErrorAction SilentlyContinue).LastWriteTime
          "first install: exe present=$([bool]$first)  desktop shortcut=$(Test-Path "$env:USERPROFILE\Desktop\Pacitum Browser.lnk")" | Tee-Object installer-shots\upgrade-check.txt
          # 2) run the same installer again silently: must upgrade in place (same AppId → same dir, one uninstall entry)
          Start-Process $setup -ArgumentList '/VERYSILENT','/CURRENTUSER','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $keys = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '*FD3A16C9-4CF0-4B0B-BBEC-A5E3334D7CFE*' }
          $keys | ForEach-Object { $_ | Get-ItemProperty | Select-Object PSChildName, DisplayName, DisplayVersion, InstallLocation | Format-List | Out-String | Write-Host }
          "uninstall entries after re-install: $(@($keys).Count)" | Tee-Object -Append installer-shots\upgrade-check.txt
          Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -ErrorAction SilentlyContinue | Out-String | Tee-Object -Append installer-shots\upgrade-check.txt
          if (@($keys).Count -ne 1) { Write-Error "expected exactly one uninstall entry"; exit 1 }
          # 3) what the built-in updater does: silent upgrade with /RELAUNCH=1 must start the browser again
          # (not Start-Process -Wait: that also waits for the relaunched browser, i.e. forever)
          $u = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/NORESTARTAPPLICATIONS','/RELAUNCH=1' -PassThru
          if (-not $u.WaitForExit(180000)) { Write-Host "silent upgrade did not finish in 180 s" }
          $relaunched = $false
          for ($i = 0; $i -lt 40 -and -not $relaunched; $i++) { Start-Sleep -Milliseconds 500; $relaunched = [bool](Get-Process PacitumBrowser -ErrorAction SilentlyContinue) }
          "updater-style silent upgrade relaunched the browser: $relaunched" | Tee-Object -Append installer-shots\upgrade-check.txt
          Start-Sleep 3; Shot '5-relaunched'
          Get-Process PacitumBrowser -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v7.0.2
        if: failure()   # logs/screens only when a test fails (keeps Actions storage small)
        with: { name: "installer-screens-${{ matrix.line }}", path: installer-shots/, if-no-files-found: ignore, retention-days: 1 }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PacitumBrowser-Setup-${{ matrix.line }}
          path: installer/*.exe
          retention-days: 3   # releases keep their own copy (tag builds attach it)
