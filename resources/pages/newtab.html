<!doctype html><html lang="en"><head><meta charset="utf-8"><title>New Tab</title>
<meta name="color-scheme" content="light dark">
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:local("Inter Regular"),url(pacitum://fonts/Inter-Regular.ttf) format("truetype")}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:local("Inter Medium"),url(pacitum://fonts/Inter-Medium.ttf) format("truetype")}
@font-face{font-family:Inter;font-style:normal;font-weight:600;font-display:swap;src:local("Inter SemiBold"),url(pacitum://fonts/Inter-SemiBold.ttf) format("truetype")}
@font-face{font-family:Inter;font-style:normal;font-weight:700;font-display:swap;src:local("Inter Bold"),url(pacitum://fonts/Inter-Bold.ttf) format("truetype")}
/* Pacitum 1.6 home (home-profile-spec.md §1): Variant A "Calm" + customize sheet; B (wallpaper) and C (focus) as options. */
:root{--chrome:%CHROME%;--card:%TOOL%;--page:%PAGE%;--surf:%SURF%;--surfh:%SURFH%;--bord:%BORD%;--bord2:%BORD2%;--txt:%TXT%;--sec:%SEC%;--ter:%TER%;
--acc:%ACC%;--acch:%ACCH%;--accs:%ACCS%;--onacc:%ONACC%;--ring:%RING%;--warn:%WARN%;--dan:%DANGER%;--blob1:%PCOL%;--bo:%BLOBO%;
--sh1:0 1px 2px rgba(16,24,40,.10),0 0 0 1px rgba(16,24,40,.05);--shp:0 16px 40px rgba(16,24,40,.16),0 0 0 1px rgba(16,24,40,.06);
--out:cubic-bezier(.33,1,.68,1);--in:cubic-bezier(.32,0,.67,0);--back:cubic-bezier(.34,1.56,.64,1)}
html.dark{--sh1:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);--shp:0 16px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font:13px/1.35 Inter,"Segoe UI",system-ui,sans-serif;color:var(--txt);background:var(--page);overflow:hidden;position:relative;user-select:none}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none}
/* backgrounds */
.bgl{position:absolute;inset:0;transition:opacity .3s var(--out);pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--bo)}
.b1{width:620px;height:420px;left:-120px;top:-160px;background:var(--blob1)}.b2{width:620px;height:460px;right:-160px;bottom:-200px;background:#6366F1}
#wall{background-size:cover;background-position:center}
#wall::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.10),rgba(0,0,0,.55))}
.scene{background:radial-gradient(1200px 500px at 70% 18%,#ffd9a8 0,#f59e6b 20%,transparent 46%),linear-gradient(#1e3a5f 0,#40668f 38%,#e59a6a 62%,#2c3e50 63%,#1b2838 100%)}
/* layout A */
.wrap{position:absolute;inset:0;overflow:auto}
.hc{position:relative;display:flex;flex-direction:column;align-items:center;padding:64px 20px 90px;min-height:100%}
.logo{width:40px;height:40px}
.greet{font-size:34px;font-weight:600;letter-spacing:-.6px;margin-top:10px;text-align:center}
.date{color:var(--sec);font-size:14px;margin-top:6px;display:flex;gap:8px;align-items:center;min-height:19px}
.date .wx{display:flex;gap:6px;align-items:center}
.hs{width:680px;max-width:100%;height:54px;border-radius:16px;background:var(--card);box-shadow:var(--sh1),0 8px 24px rgba(0,0,0,.08);display:flex;align-items:center;gap:12px;padding:0 8px 0 8px;margin-top:28px;transition:box-shadow .16s var(--out)}
.hs:focus-within{box-shadow:0 0 0 2px var(--acc),0 12px 32px rgba(0,0,0,.12)}
.eng{height:38px;border-radius:11px;padding:0 8px 0 8px;display:flex;align-items:center;gap:6px;background:var(--surf);font-size:13px;font-weight:500;position:relative}
.eng:hover{background:var(--surfh)}
.ef{width:20px;height:20px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.hs input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;height:100%}
.hs input::placeholder{color:var(--ter)}
.mic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--sec)}.mic:hover{background:var(--surf)}
.menu{position:absolute;z-index:30;min-width:200px;padding:6px;border-radius:16px;background:var(--card);box-shadow:var(--shp);animation:pop .14s var(--out)}
.menu button{display:flex;width:100%;height:34px;align-items:center;gap:10px;padding:0 10px;border-radius:10px;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--surf);outline:0}.menu .a{color:var(--acc);font-weight:600}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* dock */
.dock{display:flex;gap:4px;padding:10px;border-radius:22px;background:color-mix(in srgb,var(--card) 70%,transparent);box-shadow:inset 0 0 0 1px var(--bord);margin-top:28px;backdrop-filter:blur(20px);max-width:100%;flex-wrap:wrap;justify-content:center}
.sc{width:96px;height:96px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:12px;position:relative;color:var(--txt);text-decoration:none;transition:background-color .12s var(--out),box-shadow .16s var(--out);touch-action:none}
.sc:hover,.sc:focus-visible{background:var(--surf);outline:0}
.sc .fav{transition:transform .12s var(--out)}.sc:hover .fav{transform:translateY(-2px)}.sc:active .fav{transform:scale(.96);transition-duration:.08s}
.wc{transition:box-shadow .16s var(--out),transform .16s var(--out)}.wc:hover{transform:translateY(-1px)}
html.rm .sc .fav,html.rm .wc{transition:none!important;transform:none!important}
.sc .l{max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:18px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);flex:none}
.fav.add{background:var(--surf);color:var(--sec);box-shadow:inset 0 0 0 1.5px var(--bord2)}
.ed{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:11px;display:grid;place-items:center;color:var(--sec);background:var(--card);box-shadow:var(--sh1);opacity:0;transform:scale(.8);transition:opacity .12s var(--out),transform .12s var(--back)}
.ed svg{width:12px;height:12px}
.sc:hover .ed,.sc:focus-within .ed,.editing .ed{opacity:1;transform:none}
.sc.lift{z-index:5;transform:scale(1.05);box-shadow:var(--shp);background:var(--card);transition:none;cursor:grabbing}
/* widgets */
.wid{display:flex;gap:16px;margin-top:28px;flex-wrap:wrap;justify-content:center;max-width:1082px}
.wc{width:350px;height:156px;border-radius:18px;background:var(--card);box-shadow:var(--sh1);padding:16px 18px;position:relative;overflow:hidden}
.wc h4{font-size:12px;font-weight:600;color:var(--sec);display:flex;align-items:center;gap:8px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.wc h4 .i{color:var(--acc)}.wc h4 a,.wc h4 button{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--acc);font-weight:500;font-size:12px;text-decoration:none}
.wbody{transition:opacity .16s var(--out)}.wbody.fade{opacity:0}
.wxm .big svg{width:44px;height:44px}.eng svg{width:14px;height:14px;color:var(--sec)}
.wxm{display:flex;gap:14px;align-items:center}.wxm .big{width:44px;height:44px;color:var(--warn)}
.temp{font-size:34px;font-weight:600;letter-spacing:-.5px;line-height:1}.cond{color:var(--sec);font-size:13px;margin-top:4px}
.days{display:flex;gap:18px;color:var(--sec);font-size:12px;margin-top:14px}
.empty{color:var(--sec);font-size:13px;line-height:1.5}
.loc{display:flex;gap:8px;margin-top:10px}.loc input{flex:1;height:32px;border-radius:8px;border:1px solid var(--bord);background:var(--page);padding:0 10px;outline:0}.loc input:focus{border:2px solid var(--acc);padding:0 9px}
.btn{height:32px;padding:0 14px;border-radius:16px;background:var(--acc);color:var(--onacc);font-weight:600}
.rl{display:flex;gap:10px;align-items:center;height:30px;color:var(--txt);text-decoration:none;border-radius:6px}
.rl:hover .t{color:var(--acc)}.rl .fav{width:18px;height:18px;border-radius:5px;font-size:10px}
.rl .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rl small{color:var(--ter);font-size:11px;flex:none}
.pb{height:3px;border-radius:2px;background:var(--surf);width:60px;flex:none}.pb i{display:block;height:100%;border-radius:2px;background:var(--acc)}
.cz{position:fixed;right:20px;bottom:20px;height:34px;border-radius:17px;padding:0 14px 0 12px;display:flex;gap:8px;align-items:center;background:var(--card);box-shadow:var(--sh1);font-weight:500;z-index:10}
.cz:hover{background:var(--surf)}
/* B: wallpaper */
.wp .hc{padding-top:110px}
.wp .greet,.wp .date,.wp .credit{color:#fff}.wp .date{color:rgba(255,255,255,.85)}
.clock{display:none;font-size:88px;font-weight:300;letter-spacing:-3px;line-height:1;color:#fff}.wp .clock{display:block}.wp .logo{display:none}
.wp .greet{font-size:22px;font-weight:500;letter-spacing:-.2px}
.wp .hs,.wp .dock,.wp .cz{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);backdrop-filter:blur(24px) saturate(140%);color:#fff}
.wp .hs input,.wp .hs input::placeholder{color:rgba(255,255,255,.85)}.wp .eng{background:rgba(255,255,255,.16);color:#fff}
.wp .sc{color:#fff}.wp .sc:hover{background:rgba(255,255,255,.14)}.wp .mic{color:#fff}
.wp .wid{display:none!important}
.credit{display:none;position:fixed;left:20px;bottom:26px;font-size:12px;color:rgba(255,255,255,.75)!important}.wp .credit{display:block}
/* C: focus */
.fc .hc{align-items:flex-start;width:760px;max-width:100%;margin:0 auto;padding-top:120px}
.fc .logo,.fc .date{display:none}.fc .greet{font-size:44px;text-align:left;margin:0}
.fc .hs{width:760px;margin-top:28px}
.fc .dock{background:none;box-shadow:none;backdrop-filter:none;padding:0;justify-content:flex-start;gap:8px;margin-top:20px}
.fc .sc{width:auto;height:34px;border-radius:17px;flex-direction:row;gap:8px;padding:0 14px 0 6px;box-shadow:inset 0 0 0 1px var(--bord)}
.fc .sc .fav{width:22px;height:22px;font-size:11px}.fc .sc .ed{display:none}
.fc .wid{display:none!important}
.cont{display:none;width:100%;margin-top:34px}.fc .cont{display:block}
.cont h3{font-size:13px;font-weight:600;color:var(--sec);margin:0 0 8px 12px}
.cont a{display:flex;align-items:center;gap:12px;height:44px;border-radius:12px;padding:0 12px;color:var(--txt);text-decoration:none}
.cont a:hover{background:var(--surf)}.cont a .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cont small{color:var(--ter)}
/* customize sheet */
.sheet{position:fixed;top:0;right:0;bottom:0;width:384px;max-width:100%;background:var(--card);box-shadow:var(--shp);padding:0 20px 20px;overflow:auto;border-radius:16px 0 0 16px;z-index:20;
  transform:translateX(384px);opacity:0;visibility:hidden;transition:transform .18s var(--in),opacity .18s var(--in),visibility 0s .18s;color:var(--txt)}
.sheet.open{transform:none;opacity:1;visibility:visible;transition:transform .24s var(--out),opacity .16s var(--out),visibility 0s}
.shh{height:60px;display:flex;align-items:center;font-size:16px;font-weight:600}.shh span{flex:1}
.x{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;color:var(--sec)}.x:hover{background:var(--surf)}
.sec{font-size:12px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px}
.bgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bgo{width:100%;display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--sec);text-align:center}
.th{width:100%;height:58px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--bord);display:grid;place-items:center;color:var(--sec);background-size:cover;transition:box-shadow .16s var(--out)}
.bgo[aria-checked=true] .th{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
.t-calm{background:radial-gradient(60px 40px at 15% 10%,color-mix(in srgb,var(--blob1) 55%,transparent),transparent),radial-gradient(60px 40px at 90% 100%,#6366F166,transparent),var(--page)}
.t-plain{background:var(--page)}.t-up{background:var(--surf)}
.tg{display:flex;align-items:center;gap:12px;height:44px;cursor:pointer}.tg .i{color:var(--sec);width:18px;height:18px}.tg span{flex:1}
.sw{width:36px;height:20px;border-radius:10px;background:var(--bord2);position:relative;flex:none;transition:background .16s var(--out)}
.sw::after{content:"";position:absolute;width:16px;height:16px;top:2px;left:2px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .16s var(--out)}
[aria-checked=true]>.sw{background:var(--acc)}[aria-checked=true]>.sw::after{left:18px}
.seg{display:inline-flex;background:var(--surf);border-radius:17px;padding:2px}
.seg button{height:30px;padding:0 14px;border-radius:15px;display:flex;align-items:center;gap:6px;color:var(--sec)}
.seg button[aria-checked=true]{background:var(--card);box-shadow:var(--sh1);font-weight:600;color:var(--txt)}
.row{display:flex;align-items:center;gap:12px;height:44px;width:100%;text-align:left}.row span{flex:1}.row .i{color:var(--sec);width:18px;height:18px}
/* popovers */
.pop{position:absolute;z-index:40;width:280px;padding:14px;border-radius:14px;background:var(--card);box-shadow:var(--shp);animation:pop .14s var(--out);color:var(--txt)}
.pop label{display:block;font-size:12px;font-weight:600;color:var(--sec);margin:8px 0 6px}
.pop input{width:100%;height:36px;border-radius:10px;border:1px solid var(--bord);background:var(--page);padding:0 12px;outline:0}
.pop input:focus{border:2px solid var(--acc);padding:0 11px}
.pop .bar{display:flex;gap:8px;margin-top:14px;align-items:center}.pop .bar .sp{flex:1}
.b2{height:32px;padding:0 14px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--bord2);font-weight:500}.b2:hover{background:var(--surf)}
.dang{color:var(--dan);font-weight:500;height:32px;padding:0 8px;border-radius:16px}.dang:hover{background:var(--surf)}
/* page enter (240 ms OutCubic, staggered) */
.en{animation:enter .24s var(--out) both}
.d1{animation-delay:40ms}.d2{animation-delay:80ms}.d3{animation-delay:120ms}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* reduced motion: no translate or scale, opacity only (120 ms), no staggering */
html.rm .en{animation:fade .12s linear both;animation-delay:0s!important}
@keyframes fade{from{opacity:0}to{opacity:1}}
html.rm .sheet,html.rm .sheet.open{transform:none;transition:opacity .12s linear,visibility 0s}
html.rm .sheet:not(.open){transition:opacity .12s linear,visibility 0s .12s}
html.rm .ed{transform:none;transition:opacity .12s linear}html.rm .sc.lift{transform:none}
html.rm .menu,html.rm .pop{animation:fade .12s linear}
html.rm *{scroll-behavior:auto}
/* reflow */
@media (max-width:1180px){.wid{max-width:716px}}
@media (max-height:700px){.wid{display:none}}
@media (max-width:800px){.hs{width:100%}}
</style></head>
<body>
<div class="bgl" id="calm"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="bgl" id="wall" style="opacity:0"></div>
<div class="wrap" id="wrap"><div class="hc" id="hc">
  <img class="logo en" src="qrc:/pages/logo.png" alt="">
  <div class="clock en" id="clock"></div>
  <div class="greet en" id="greet"></div>
  <div class="date en" id="date"></div>
  <form class="hs en d1" id="sf" role="search"><button type="button" class="eng" id="eng" aria-haspopup="menu" aria-label="Search engine"></button>
    <input id="q" placeholder="Search the web or type a URL" autocomplete="off" aria-label="Search the web or type a URL" autofocus>
    <button type="button" class="mic" id="mic" title="Search" aria-label="Search">%I_SEARCH%</button></form>
  <div class="dock en d2" id="dock" role="list"></div>
  <div class="cont" id="cont"></div>
  <div class="wid en d3" id="wid">
    <section class="wc" id="w-weather"><h4>%I_WEATHER% Weather<button id="wxloc"></button></h4><div class="wbody" id="wx"></div></section>
    <section class="wc" id="w-reading"><h4>%I_READING% Continue reading<a href="pacitum://history" id="rdall">All</a></h4><div class="wbody" id="rd"></div></section>
    <section class="wc" id="w-dl"><h4>%I_DOWNLOAD% Downloads<a href="#" id="dlall">All</a></h4><div class="wbody" id="dl"></div></section>
  </div>
</div></div>
<div class="credit" id="credit"></div>
<button class="cz" id="cz" aria-haspopup="dialog" aria-controls="sheet">%I_CUSTOMIZE% Customize</button>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shh" aria-hidden="true">
  <div class="shh"><span id="shh">Customize home</span><button class="x" id="shx" aria-label="Close">%I_CLOSE%</button></div>
  <div class="sec">Background</div>
  <div class="bgs" role="radiogroup" aria-label="Background">
    <button class="bgo" data-bg="calm" role="radio"><div class="th t-calm"></div>Calm</button>
    <button class="bgo" data-bg="wallpaper" role="radio"><div class="th scene"></div>Wallpaper</button>
    <button class="bgo" data-bg="plain" role="radio"><div class="th t-plain"></div>Plain</button>
    <button class="bgo" data-bg="upload" role="radio"><div class="th t-up" id="upth">%I_UPLOAD%</div>Upload</button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="tg" role="switch" tabindex="0" data-k="tint">%I_PALETTE%<span>Tint with accent colour</span><i class="sw"></i></div>
  <div class="sec">Layout</div>
  <div class="seg" role="radiogroup" aria-label="Layout"><button role="radio" data-layout="calm">Calm</button><button role="radio" data-layout="focus">Focus</button></div>
  <div class="sec">Shortcuts</div>
  <div class="seg" role="radiogroup" aria-label="Shortcuts"><button role="radio" data-mode="mine">My shortcuts</button><button role="radio" data-mode="top">Most visited</button></div>
  <div class="tg" role="switch" tabindex="0" data-k="showSc">%I_GRID%<span>Show shortcuts</span><i class="sw"></i></div>
  <button class="row" id="edsc">%I_EDIT%<span>Edit shortcuts…</span>%I_CHEV%</button>
  <div class="sec">Widgets</div>
  <div class="tg" role="switch" tabindex="0" data-w="greet">%I_CLOCK%<span>Greeting &amp; date</span><i class="sw"></i></div>
  <div class="tg" role="switch" tabindex="0" data-w="weather">%I_WEATHER%<span>Weather</span><i class="sw"></i></div>
  <div class="tg" role="switch" tabindex="0" data-w="reading">%I_READING%<span>Continue reading</span><i class="sw"></i></div>
  <div class="tg" role="switch" tabindex="0" data-w="downloads">%I_DOWNLOAD%<span>Downloads</span><i class="sw"></i></div>
  <div class="sec">Theme</div>
  <div class="seg" role="radiogroup" aria-label="Theme"><button role="radio" data-theme="System">%I_SYSTEM% System</button><button role="radio" data-theme="Light">%I_SUN% Light</button><button role="radio" data-theme="Dark">%I_MOON% Dark</button></div>
</aside>
<script>
"use strict";
var D=%DATA%;
var I=%ICONS%;
var $=function(s){return document.querySelector(s)},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var H=document.documentElement;
if(D.dark)H.classList.add("dark");
if(D.reduced||matchMedia("(prefers-reduced-motion: reduce)").matches)H.classList.add("rm");
var KEY="pacitum.home.v1";
var DEF_SC=[["Mail","https://mail.google.com"],["GitHub","https://github.com"],["Qt Docs","https://doc.qt.io"],["YouTube","https://youtube.com"],["Weather","https://weather.com"],["Figma","https://figma.com"],["Hacker News","https://news.ycombinator.com"]];
var S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
function dflt(k,v){if(S[k]===undefined)S[k]=v}
dflt("bg","calm");dflt("tint",true);dflt("layout","calm");dflt("mode","mine");dflt("showSc",true);
dflt("w",{greet:true,weather:true,reading:true,downloads:true});
dflt("sc",DEF_SC.map(function(x){return{n:x[0],u:x[1]}}));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function act(name,args){var q=Object.keys(args||{}).map(function(k){return k+"="+encodeURIComponent(args[k])}).join("&");
  return fetch("pacitum://action/"+name+(q?"?"+q:"")).catch(function(){})}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}}
var COLS=["#EA4335","#24292F","#41CD52","#FF0000","#0EA5E9","#8B5CF6","#F97316","#0A66C2","#1DB954","#64748B","#E11D48","#14B8A6"];
var KNOWN={"mail.google.com":"#EA4335","github.com":"#24292F","doc.qt.io":"#41CD52","youtube.com":"#FF0000","weather.com":"#0EA5E9","figma.com":"#8B5CF6","news.ycombinator.com":"#F97316"};
function col(u){var h=host(u);if(KNOWN[h])return KNOWN[h];var n=0;for(var i=0;i<h.length;i++)n=(n*31+h.charCodeAt(i))|0;return COLS[Math.abs(n)%COLS.length]}
function fav(n,u,cls){return '<span class="fav'+(cls?" "+cls:"")+'" style="background:'+col(u)+'">'+esc((n||host(u)||"?").trim().charAt(0).toUpperCase())+"</span>"}
function ago(t){var s=Date.now()/1000-t;if(s<90)return"now";if(s<3600)return Math.round(s/60)+" min";if(s<86400)return Math.round(s/3600)+" h";if(s<172800)return"Yesterday";return Math.round(s/86400)+" d"}
function go(v){v=(v||"").trim();if(!v)return;
  var url=/^[a-z][a-z0-9+.-]*:/i.test(v)&&!/^[a-z]+:\d/i.test(v)?v:(v.indexOf(".")>0&&v.indexOf(" ")<0?"https://"+v:(D.engines[D.engine]||D.search)+encodeURIComponent(v));
  location.href=url}
/* greeting */
function greet(){var h=new Date().getHours();var g=h>=5&&h<12?"Good morning":h>=12&&h<18?"Good afternoon":"Good evening";
  $("#greet").textContent=S.layout==="focus"?g+".":g+(D.first?", "+D.first:"");
  $("#date").firstChild||($("#date").innerHTML='<span id="dt"></span><span class="wx" id="dwx"></span>');
  $("#dt").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  var c=new Date();$("#clock").textContent=String(c.getHours()).padStart(2,"0")+":"+String(c.getMinutes()).padStart(2,"0")}
/* engine chip */
function engine(){var e=D.engine;$("#eng").innerHTML='<span class="ef" style="background:'+col(D.engines[e]||"")+'">'+esc(e.charAt(0))+"</span>"+I.chevd}
$("#eng").onclick=function(ev){ev.stopPropagation();closeMenus();var m=document.createElement("div");m.className="menu";m.setAttribute("role","menu");
  Object.keys(D.engines).forEach(function(k){var b=document.createElement("button");b.setAttribute("role","menuitemradio");b.textContent=k;if(k===D.engine)b.className="a";
    b.onclick=function(){D.engine=k;engine();act("engine",{v:k});closeMenus();$("#q").focus()};m.appendChild(b)});
  var r=this.getBoundingClientRect();m.style.left=r.left+"px";m.style.top=(r.bottom+6+scrollY)+"px";document.body.appendChild(m);m.querySelector("button").focus()};
$("#sf").onsubmit=function(e){e.preventDefault();go($("#q").value)};
$("#mic").onclick=function(){go($("#q").value)||$("#q").focus()};
/* shortcuts */
var editing=false;
function list(){return S.mode==="top"?(D.top||[]).slice(0,8).map(function(x){return{n:x.t||host(x.u),u:x.u}}):S.sc.slice(0,8)}
function dock(){var d=$("#dock");d.style.display=S.showSc?"":"none";d.classList.toggle("editing",editing);
  var h="";list().forEach(function(s,i){h+='<a class="sc" role="listitem" href="'+esc(s.u)+'" data-i="'+i+'" draggable="false" title="'+esc(s.n)+"\n"+esc(s.u)+'">'+fav(s.n,s.u)+'<span class="l">'+esc(s.n)+"</span>"+
    (S.mode==="mine"?'<button class="ed" aria-label="Edit '+esc(s.n)+'" tabindex="-1">'+I.edit12+'</button>':"")+"</a>"});
  if(S.mode==="mine"&&S.sc.length<8)h+='<button class="sc" id="addsc"><span class="fav add">+</span><span class="l">Add</span></button>';
  if(S.mode==="top"&&!list().length)h='<div class="empty" style="padding:20px">Sites you visit often will show up here.</div>';
  d.innerHTML=h;
  $$(".sc .ed").forEach(function(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();editPop(+b.parentNode.dataset.i,b.parentNode)}});
  var a=$("#addsc");if(a)a.onclick=function(){editPop(-1,a)};
  $$(".sc[data-i]").forEach(function(t){t.oncontextmenu=function(e){e.preventDefault();ctx(+t.dataset.i,e.clientX,e.clientY)};if(S.mode==="mine")drag(t)});
  cont()}
function closeMenus(){$$(".menu,.pop").forEach(function(m){m.remove()})}
function ctx(i,x,y){closeMenus();var s=list()[i];var m=document.createElement("div");m.className="menu";m.setAttribute("role","menu");
  var items=[["Open in new tab",function(){act("open",{url:s.u})}]];
  if(S.mode==="mine")items.unshift(["Edit",function(){editPop(i,$('.sc[data-i="'+i+'"]'))}]),items.push(["Remove",function(){S.sc.splice(i,1);save();dock()}]);
  items.forEach(function(it){var b=document.createElement("button");b.setAttribute("role","menuitem");b.textContent=it[0];b.onclick=function(){closeMenus();it[1]()};m.appendChild(b)});
  m.style.left=Math.min(x,innerWidth-210)+"px";m.style.top=(y+scrollY)+"px";document.body.appendChild(m);m.querySelector("button").focus()}
function editPop(i,anchor){closeMenus();var s=i>=0?S.sc[i]:{n:"",u:""};var p=document.createElement("div");p.className="pop";p.setAttribute("role","dialog");p.setAttribute("aria-label",i>=0?"Edit shortcut":"Add shortcut");
  p.innerHTML='<label for="pn">Name</label><input id="pn" maxlength="40"><label for="pu">URL</label><input id="pu" placeholder="https://"><div class="bar">'+(i>=0?'<button class="dang" id="prm">Remove</button>':"")+'<span class="sp"></span><button class="b2" id="pcn">Cancel</button><button class="btn" id="pok">'+(i>=0?"Save":"Add")+"</button></div>";
  document.body.appendChild(p);$("#pn").value=s.n;$("#pu").value=s.u;
  var r=anchor.getBoundingClientRect();p.style.left=Math.max(8,Math.min(r.left,innerWidth-290))+"px";p.style.top=(r.bottom+8+$("#wrap").scrollTop)+"px";
  $("#pn").focus();
  function ok(){var u=$("#pu").value.trim();if(!u){$("#pu").focus();return}if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u="https://"+u;var n=$("#pn").value.trim()||host(u);
    if(i>=0)S.sc[i]={n:n,u:u};else S.sc.push({n:n,u:u});save();closeMenus();dock()}
  $("#pok").onclick=ok;$("#pcn").onclick=closeMenus;if(i>=0)$("#prm").onclick=function(){S.sc.splice(i,1);save();closeMenus();dock()};
  p.onkeydown=function(e){if(e.key==="Enter")ok();if(e.key==="Escape"){e.stopPropagation();closeMenus()}}}
/* drag to reorder: lifted tile 1.05 + shadow-popup, neighbours slide 160 ms OutCubic (FLIP) */
function drag(t){var sx,sy,on=false,moved=false;
  t.addEventListener("pointerdown",function(e){if(e.button!==0||e.target.closest(".ed"))return;sx=e.clientX;sy=e.clientY;on=true;moved=false;t.setPointerCapture(e.pointerId)});
  t.addEventListener("pointermove",function(e){if(!on)return;var dx=e.clientX-sx,dy=e.clientY-sy,rm=H.classList.contains("rm");
    if(!moved&&Math.abs(dx)+Math.abs(dy)<6)return;moved=true;t.classList.add("lift");
    var tiles=$$(".sc[data-i]").filter(function(x){return x!==t}),tgt=null;
    tiles.forEach(function(x){var r=x.getBoundingClientRect();if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)tgt=x});
    if(tgt){tiles.forEach(function(x){x._b=x.getBoundingClientRect()});var ol=t.offsetLeft,ot=t.offsetTop,from=+t.dataset.i,to=+tgt.dataset.i;
      S.sc.splice(to,0,S.sc.splice(from,1)[0]);
      t.parentNode.insertBefore(t,to>from?tgt.nextSibling:tgt);$$(".sc[data-i]").forEach(function(x,k){x.dataset.i=k});
      sx+=t.offsetLeft-ol;sy+=t.offsetTop-ot;dx=e.clientX-sx;dy=e.clientY-sy;
      if(!rm)tiles.forEach(function(x){var r=x.getBoundingClientRect(),b=x._b;if(b.left!==r.left||b.top!==r.top)
        x.animate([{transform:"translate("+(b.left-r.left)+"px,"+(b.top-r.top)+"px)"},{transform:"none"}],{duration:160,easing:"cubic-bezier(.33,1,.68,1)"})})}
    t.style.transform=(rm?"":"scale(1.05) ")+"translate("+dx+"px,"+dy+"px)"});
  function end(){if(!on)return;on=false;if(!moved)return;t.classList.remove("lift");t.style.transform="";save();
    t.addEventListener("click",function k(ev){ev.preventDefault();ev.stopPropagation();t.removeEventListener("click",k,true)},true)}
  t.addEventListener("pointerup",end);t.addEventListener("pointercancel",end)}
$("#edsc").onclick=function(){editing=!editing;if(S.mode!=="mine"){S.mode="mine";save();sync()}dock();closeSheet()};
/* widgets */
var WX={0:["Clear","sun"],1:["Mostly clear","sun"],2:["Partly cloudy","pc"],3:["Overcast","cl"],45:["Fog","cl"],48:["Fog","cl"],51:["Drizzle","rn"],53:["Drizzle","rn"],55:["Drizzle","rn"],61:["Rain","rn"],63:["Rain","rn"],65:["Heavy rain","rn"],71:["Snow","sn"],73:["Snow","sn"],75:["Snow","sn"],80:["Showers","rn"],81:["Showers","rn"],82:["Showers","rn"],95:["Thunderstorm","rn"]};
var WXI=I.weather44;
function swap(el,html){if(el.innerHTML===html)return;if(H.classList.contains("rm")||!el.innerHTML){el.innerHTML=html;return}el.classList.add("fade");setTimeout(function(){el.innerHTML=html;el.classList.remove("fade")},160)}
function weather(){var w=$("#wx"),L=S.loc;$("#wxloc").textContent=L?L.name:"";$("#wxloc").onclick=function(){setLoc()};
  if(!L){w.innerHTML='<div class="empty">Weather is off until you choose a location. Pacitum asks a public weather service (open-meteo.com) for that place only.</div><button class="btn" style="margin-top:10px" id="wxset">Set location</button>';$("#wxset").onclick=setLoc;$("#dwx").innerHTML="";return}
  var c=S.wx;if(c&&Date.now()-c.at<30*60e3){paintWx(c);return}
  if(c)paintWx(c);
  fetch("https://api.open-meteo.com/v1/forecast?latitude="+L.lat+"&longitude="+L.lon+"&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5")
   .then(function(r){return r.json()}).then(function(j){S.wx={at:Date.now(),t:Math.round(j.current.temperature_2m),c:j.current.weather_code,hi:Math.round(j.daily.temperature_2m_max[0]),lo:Math.round(j.daily.temperature_2m_min[0]),
     d:j.daily.time.slice(1,5).map(function(t,k){return[new Date(t+"T12:00").toLocaleDateString(undefined,{weekday:"short"}),Math.round(j.daily.temperature_2m_max[k+1])]})};save();paintWx(S.wx)})
   .catch(function(){if(!c)swap(w,'<div class="empty">Couldn’t load the weather for '+esc(L.name)+".</div>")})}
function paintWx(c){var k=WX[c.c]||["",""];swap($("#wx"),'<div class="wxm"><span class="big">'+WXI+'</span><div><div class="temp">'+c.t+'°</div><div class="cond">'+esc(k[0])+" · H "+c.hi+"° L "+c.lo+'°</div></div></div><div class="days">'+c.d.map(function(d){return"<span>"+esc(d[0])+" "+d[1]+"°</span>"}).join("")+"</div>");
  $("#dwx").innerHTML=S.w.weather?"· "+I.weather16+" "+c.t+"° "+esc(S.loc.name):""}
function setLoc(){var w=$("#wx");w.innerHTML='<div class="empty">City for the weather</div><form class="loc" id="lf"><input id="li" placeholder="e.g. Lisbon" aria-label="City"><button class="btn">Set</button></form>';
  $("#li").focus();$("#lf").onsubmit=function(e){e.preventDefault();var n=$("#li").value.trim();if(!n){S.loc=null;S.wx=null;save();weather();return}
    fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(n)).then(function(r){return r.json()}).then(function(j){
      var g=j.results&&j.results[0];if(!g){$("#li").value="";$("#li").placeholder="Not found — try another city";return}
      S.loc={name:g.name,lat:g.latitude,lon:g.longitude};S.wx=null;save();weather()}).catch(function(){$("#li").placeholder="Offline — try again later"})}}
function reading(){var r=(D.recent||[]).slice(0,3);
  swap($("#rd"),r.length?r.map(function(x){return'<a class="rl" href="'+esc(x.u)+'">'+fav(x.t,x.u)+'<span class="t">'+esc(x.t||x.u)+"</span><small>"+(x.at?ago(x.at):"")+"</small></a>"}).join(""):'<div class="empty">Pages you read and recently closed tabs show up here.</div>')}
function downloads(){var r=(D.downloads||[]).slice(0,3);
  swap($("#dl"),r.length?r.map(function(x){return'<div class="rl">'+fav(x.n,"file://"+x.n)+'<span class="t">'+esc(x.n)+"</span>"+(x.p>=0?'<span class="pb"><i style="width:'+Math.round(x.p*100)+'%"></i></span>':"<small>"+esc(x.s)+"</small>")+"</div>"}).join(""):'<div class="empty">Files you download show up here.</div>')}
$("#dlall").onclick=function(e){e.preventDefault();act("downloads")};
$("#rdall").onclick=function(e){e.preventDefault();act("history")};
function cont(){var r=(D.recent||[]).slice(0,5);$("#cont").innerHTML="<h3>Continue where you left off</h3>"+(r.length?r.map(function(x){return'<a href="'+esc(x.u)+'">'+fav(x.t,x.u)+'<span class="t">'+esc(x.t||x.u)+"</span><small>"+(x.at?ago(x.at):"")+"</small></a>"}).join(""):'<div class="empty" style="padding:0 12px">Nothing yet.</div>')}
/* background + layout */
function wallUrl(){return S.bg==="upload"&&localStorage.getItem(KEY+".img")?"url("+localStorage.getItem(KEY+".img")+")":""}
function apply(){var wp=S.bg==="wallpaper"||S.bg==="upload";
  H.classList.toggle("wp",wp&&S.layout!=="focus");H.classList.toggle("fc",S.layout==="focus");
  var wall=$("#wall");wall.className="bgl"+(S.bg==="wallpaper"?" scene":"");wall.style.backgroundImage=wallUrl();
  wall.style.opacity=wp?1:0;$("#calm").style.opacity=(S.bg==="calm"&&S.tint)?1:0;
  $("#credit").textContent=S.bg==="upload"?"Your photo":"Dusk over the bay · Pacitum";
  $("#w-weather").style.display=S.w.weather?"":"none";$("#w-reading").style.display=S.w.reading?"":"none";$("#w-dl").style.display=S.w.downloads?"":"none";
  $("#wid").style.display=(S.w.weather||S.w.reading||S.w.downloads)?"":"none";
  $("#greet").style.display=$("#date").style.display=S.w.greet?"":"none";
  greet();dock();if(S.w.weather)weather();else $("#dwx").innerHTML=""}
/* customize sheet */
function sync(){$$(".bgo").forEach(function(b){b.setAttribute("aria-checked",b.dataset.bg===S.bg)});
  $$("[data-layout]").forEach(function(b){b.setAttribute("aria-checked",b.dataset.layout===S.layout)});
  $$("[data-mode]").forEach(function(b){b.setAttribute("aria-checked",b.dataset.mode===S.mode)});
  $$("[data-theme]").forEach(function(b){b.setAttribute("aria-checked",b.dataset.theme===D.theme)});
  $$(".tg[data-k]").forEach(function(b){b.setAttribute("aria-checked",!!S[b.dataset.k])});
  $$(".tg[data-w]").forEach(function(b){b.setAttribute("aria-checked",!!S.w[b.dataset.w])});
  var im=localStorage.getItem(KEY+".img");$("#upth").style.backgroundImage=im?"url("+im+")":"";$("#upth").innerHTML=im?"":I.upload}
function change(){save();sync();apply()}
$$(".bgo").forEach(function(b){b.onclick=function(){if(b.dataset.bg==="upload"&&(!localStorage.getItem(KEY+".img")||S.bg==="upload")){$("#file").click();return}S.bg=b.dataset.bg;change()}});
$("#file").onchange=function(){var f=this.files[0];if(!f)return;var img=new Image();img.onload=function(){
  var sc=Math.min(1,1920/img.width,1200/img.height),c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);try{localStorage.setItem(KEY+".img",c.toDataURL("image/jpeg",.85))}catch(e){alert("That image is too large.");return}
  S.bg="upload";change();URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f);this.value=""};
$$("[data-layout]").forEach(function(b){b.onclick=function(){S.layout=b.dataset.layout;change()}});
$$("[data-mode]").forEach(function(b){b.onclick=function(){S.mode=b.dataset.mode;change()}});
$$("[data-theme]").forEach(function(b){b.onclick=function(){if(D.theme===b.dataset.theme)return;D.theme=b.dataset.theme;sync();sessionStorage.setItem("pacitum.sheet","1");act("theme",{v:D.theme})}});
function tog(b){if(b.dataset.k)S[b.dataset.k]=!S[b.dataset.k];else S.w[b.dataset.w]=!S.w[b.dataset.w];change()}
$$(".tg").forEach(function(b){b.onclick=function(){tog(b)};b.onkeydown=function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();tog(b)}}});
var sheet=$("#sheet"),opener=null;
function openSheet(instant){closeMenus();opener=document.activeElement;sync();
  if(instant){sheet.style.transition="none";sheet.classList.add("open");sheet.offsetWidth;sheet.style.transition=""}else sheet.classList.add("open");
  sheet.setAttribute("aria-hidden","false");$("#cz").setAttribute("aria-expanded","true");setTimeout(function(){$("#shx").focus()},instant?0:30)}
function closeSheet(){if(!sheet.classList.contains("open"))return;sheet.classList.remove("open");sheet.setAttribute("aria-hidden","true");$("#cz").setAttribute("aria-expanded","false");if(opener&&opener.focus)opener.focus()}
$("#cz").onclick=function(e){e.stopPropagation();sheet.classList.contains("open")?closeSheet():openSheet()};
$("#shx").onclick=closeSheet;
document.addEventListener("click",function(e){if(!e.target.closest(".menu,.pop,#eng,.ed,#addsc"))closeMenus();if(sheet.classList.contains("open")&&!sheet.contains(e.target)&&!e.target.closest("#cz,.pop,.menu"))closeSheet()});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if($(".menu,.pop")){closeMenus();return}if(editing){editing=false;dock();return}closeSheet()}
  if(e.key==="Tab"&&sheet.classList.contains("open")){   // focus trap
    var f=$$("#sheet button,#sheet [tabindex='0']").filter(function(x){return x.offsetParent!==null});if(!f.length)return;
    var a=f[0],z=f[f.length-1];if(!sheet.contains(document.activeElement)){e.preventDefault();a.focus()}
    else if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  if(e.target===document.body&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey)$("#q").focus()});
/* deep links: pacitum://newtab#customize, #bg=wallpaper, #layout=focus */
location.hash.slice(1).split("&").forEach(function(kv){var p=kv.split("=");if(p[0]==="bg"&&["calm","wallpaper","plain"].indexOf(p[1])>=0)S.bg=p[1];if(p[0]==="layout"&&["calm","focus"].indexOf(p[1])>=0)S.layout=p[1]});save();
/* go */
engine();sync();apply();reading();downloads();
if(/customize/.test(location.hash)||sessionStorage.getItem("pacitum.sheet")){sessionStorage.removeItem("pacitum.sheet");openSheet(true)}
setInterval(greet,30e3);
</script></body></html>
