name: Build Linux + macOS
# Not on every push: macOS runner minutes cost much more than Linux/Windows ones.
# Runs for pull requests that touch the app, for version tags, and on demand (Actions → Run workflow).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['src/**', 'include/**', 'resources/**', 'third_party/**', 'CMakeLists.txt', '.github/workflows/linux-macos.yml']
permissions:
  contents: write   # tag builds attach the AppImage / dmg + .sha256 to an existing release (updater feed)
jobs:
  linux:
    runs-on: ubuntu-22.04   # older glibc = the AppImage runs on more distributions
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtserialport qtconnectivity'
          cache: true
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2 xvfb libfuse2 file
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
      - name: Smoke test (window opens and stays up)
        env:
          QTWEBENGINE_DISABLE_SANDBOX: '1'   # CI containers block Chromium's sandbox; real installs keep it
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" ./build/PacitumBrowser --smoke-test || echo "exit code $?"
          log="$HOME/.local/share/Pacitum/Pacitum Browser/startup.log"
          tail -n 40 "$log" || true
          grep -q "SMOKE OK" "$log"
      - name: AppImage
        run: |
          ver=$(sed -n 's/^project(PacitumBrowser VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          DESTDIR="$PWD/AppDir" cmake --install build
          # SQL drivers we don't ship pull in client libraries the AppImage tool can't find
          find "$QT_ROOT_DIR/plugins/sqldrivers" -name '*.so' ! -name 'libqsqlite.so' -delete
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_PLATFORM_PLUGINS="libqwayland-egl.so;libqwayland-generic.so"
          export OUTPUT="PacitumBrowser-$ver-linux-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e AppDir/usr/bin/PacitumBrowser \
            -d resources/linux/pacitum-browser.desktop -i resources/linux/pacitum-browser.png --plugin qt --output appimage
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
          ls -la "$OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PacitumBrowser-Linux
          path: PacitumBrowser-*.AppImage*
          retention-days: 3
      - name: Attach to the release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || { echo "no release yet; skipping"; exit 0; }
          gh release upload "${{ github.ref_name }}" PacitumBrowser-*.AppImage* --clobber --repo "${{ github.repository }}"

  macos:
    runs-on: macos-14   # Apple silicon
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtserialport qtconnectivity'
          cache: true
      - name: Build
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build
      - name: Bundle Qt into the app + ad-hoc sign
        run: |
          macdeployqt build/PacitumBrowser.app -verbose=1
          # Apple silicon refuses to run unsigned code; an ad-hoc signature is enough for a download build
          codesign --force --deep --sign - build/PacitumBrowser.app
          codesign --verify --deep build/PacitumBrowser.app
      - name: Smoke test (window opens and stays up)
        continue-on-error: true   # hosted macOS runners sometimes have no usable window server
        run: |
          build/PacitumBrowser.app/Contents/MacOS/PacitumBrowser --smoke-test || echo "exit code $?"
          log="$HOME/Library/Application Support/Pacitum/Pacitum Browser/startup.log"
          tail -n 40 "$log" || true
          grep -q "SMOKE OK" "$log"
      - name: Disk image
        run: |
          ver=$(sed -n 's/^project(PacitumBrowser VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          out="PacitumBrowser-$ver-macOS-arm64.dmg"
          mkdir dmg && cp -R build/PacitumBrowser.app "dmg/Pacitum Browser.app" && ln -s /Applications dmg/Applications
          hdiutil create -volname "Pacitum Browser" -srcfolder dmg -ov -format UDZO "$out"
          shasum -a 256 "$out" > "$out.sha256"
          ls -la "$out"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PacitumBrowser-macOS
          path: PacitumBrowser-*.dmg*
          retention-days: 3
      - name: Attach to the release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || { echo "no release yet; skipping"; exit 0; }
          gh release upload "${{ github.ref_name }}" PacitumBrowser-*.dmg* --clobber --repo "${{ github.repository }}"
