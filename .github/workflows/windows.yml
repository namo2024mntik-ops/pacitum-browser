name: Build Windows EXE
on: [push, workflow_dispatch]
permissions:
  contents: write   # tag builds attach the installer + .sha256 to an existing release (updater feed)
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter PacitumBrowser.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-quick-import --skip-plugin-types qmltooling,generic,networkinformation,position,sqldrivers dist/PacitumBrowser.exe
          # keep the SQLite driver only; drop devtools resources and unused image formats
          New-Item -ItemType Directory -Force dist/sqldrivers | Out-Null
          Copy-Item "$env:QT_ROOT_DIR/plugins/sqldrivers/qsqlite.dll" dist/sqldrivers/
          Remove-Item -Force -ErrorAction SilentlyContinue dist/resources/qtwebengine_devtools_resources.pak
          Get-ChildItem dist/imageformats -Filter *.dll | Where-Object { $_.Name -notmatch '^(qsvg|qico|qjpeg|qgif)\.dll$' } | Remove-Item -Force
          Get-ChildItem dist -Recurse -Filter *.pdb | Remove-Item -Force
          "{0:N1} MB in dist" -f ((Get-ChildItem dist -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          if (Test-Path "$env:VCToolsRedistDir\x64") { Get-ChildItem "$env:VCToolsRedistDir\x64" -Recurse -Filter *.dll | Where-Object { $_.FullName -match 'CRT' } | Copy-Item -Destination dist }
      - name: Smoke test (exe starts and shows a window)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\Pacitum\Pacitum Browser"
          $p = Start-Process dist\PacitumBrowser.exe -ArgumentList '--smoke-test' -PassThru
          # Poll for the window instead of a fixed 6 s sleep: cold runners sometimes need ~8 s
          # (QtWebEngine init) and the old check failed although the app reported SMOKE OK.
          $hwnd = 0; $alive = $true
          for ($i = 0; $i -lt 50; $i++) {
            Start-Sleep -Milliseconds 500; $p.Refresh()
            if ($p.HasExited) { $alive = $false; break }
            if ($p.MainWindowHandle -ne 0) { $hwnd = $p.MainWindowHandle; break }
          }
          Start-Sleep -Seconds 3   # let the first page paint before the screenshot
          Write-Host "alive=$alive MainWindowHandle=$hwnd title='$($p.MainWindowTitle)'"
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          New-Item -ItemType Directory -Force smoke | Out-Null
          $bmp.Save("$PWD\smoke\desktop.png"); $g.Dispose(); $bmp.Dispose()
          if (-not $p.WaitForExit(30000)) { Write-Host "still running after smoke window; killing"; $p.Kill() }
          Write-Host "exit code: $($p.ExitCode)"
          Copy-Item "$log\startup.log","$log\crash.log" smoke\ -ErrorAction SilentlyContinue
          Get-Content smoke\startup.log -ErrorAction SilentlyContinue | Select-Object -Last 60
          Get-Content smoke\crash.log -ErrorAction SilentlyContinue
          Get-ChildItem dist -Name | Out-File smoke\dist-files.txt
          Get-ChildItem dist -Recurse -Name | Out-File -Append smoke\dist-files.txt
          $tl = Get-Content smoke\startup.log -ErrorAction SilentlyContinue | Select-String 'window exposed \(time-to-window\)' | Select-Object -First 1
          "time-to-window: $tl" | Tee-Object smoke\timing.txt
          if (-not $alive -or $hwnd -eq 0 -or $p.ExitCode -ne 0) { Write-Error "SMOKE TEST FAILED"; exit 1 }
      - name: Stress test (tabs, switching, fullscreen, loads)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\Pacitum\Pacitum Browser"
          Remove-Item "$log\crash.log" -ErrorAction SilentlyContinue
          $p = Start-Process dist\PacitumBrowser.exe -ArgumentList '--stress-test' -PassThru
          if (-not $p.WaitForExit(180000)) { Write-Host "stress test hung; killing"; $p.Kill(); $p.WaitForExit() }
          New-Item -ItemType Directory -Force stress | Out-Null
          Copy-Item "$log\startup.log" stress\startup.log -ErrorAction SilentlyContinue
          Copy-Item "$log\crash.log" stress\crash.log -ErrorAction SilentlyContinue
          Get-Content stress\startup.log -ErrorAction SilentlyContinue | Where-Object { $_ -notmatch 'user gesture' } | Select-Object -Last 25
          Get-Content stress\crash.log -ErrorAction SilentlyContinue
          Write-Host "exit code: $($p.ExitCode)"
          $ok = Select-String -Path stress\startup.log -Pattern 'STRESS OK' -Quiet
          if ($p.ExitCode -ne 0 -or -not $ok -or (Test-Path stress\crash.log)) { Write-Error "STRESS TEST FAILED"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: stress-test, path: stress/, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-test, path: smoke/, if-no-files-found: ignore }
      - name: Installer
        shell: pwsh
        run: |
          # pinned: installer.iss needs 6.6+ (dynamic dark images, PNG wizard images, zircon style)
          choco install innosetup --version 6.7.1 -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # SHA256 next to the installer ("<hash>  <file>", sha256sum format): the built-in updater
          # verifies the download against the "<installer>.exe.sha256" release asset.
          Get-ChildItem installer -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Set-Content -NoNewline -Encoding ascii "$($_.FullName).sha256"
            Write-Host "$h  $($_.Name)  $($_.Length) bytes"
          }
      - name: Attach installer + SHA256 to the release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) { Write-Host "no release for ${{ github.ref_name }} yet; skipping upload"; exit 0 }
          gh release upload "${{ github.ref_name }}" (Get-ChildItem installer -File).FullName --clobber --repo "${{ github.repository }}"
      - name: Installer pages + in-place upgrade check
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          New-Item -ItemType Directory -Force installer-shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\installer-shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $setup = (Get-ChildItem installer -Filter *.exe | Select-Object -First 1).FullName
          $ws = New-Object -ComObject WScript.Shell
          # AppActivate can fail while the runner console holds the foreground; SendKeys then goes
          # to the console and the wizard stalls (seen on the location page in 1.5.1). Retry until
          # the wizard is in front, and confirm each page change below.
          function Key($k) {
            for ($t = 0; $t -lt 10 -and -not $ws.AppActivate('Setup - Pacitum Browser'); $t++) { Start-Sleep -Milliseconds 300 }
            Start-Sleep -Milliseconds 300; $ws.SendKeys($k)
          }
          $appDir = "$env:LOCALAPPDATA\Programs\Pacitum Browser"
          # 1) interactive per-user install, screenshot every page
          $p = Start-Process $setup -ArgumentList '/CURRENTUSER' -PassThru
          Start-Sleep 5; Shot '1-welcome'
          Key '{ENTER}'; Start-Sleep 3; Shot '2-location'
          # location page -> Install: press Enter until Setup has started writing files (max 5 tries)
          for ($t = 0; $t -lt 5; $t++) {
            Key '{ENTER}'
            for ($w = 0; $w -lt 8 -and -not (Test-Path $appDir); $w++) { Start-Sleep -Milliseconds 250 }
            if (Test-Path $appDir) { break }
            Write-Host "location page: Enter #$($t+1) didn't start the install; retrying"
          }
          Start-Sleep -Milliseconds 300; Shot '3-progress'
          for ($i = 0; $i -lt 90 -and -not (Test-Path "$env:LOCALAPPDATA\Programs\Pacitum Browser\unins000.exe"); $i++) { Start-Sleep 1 }
          Start-Sleep 4; Shot '4-finish'
          Key ' '; Start-Sleep 1; Key '{ENTER}'     # untick "Launch", Finish
          $p.WaitForExit(30000) | Out-Null
          Get-Process PacitumBrowser -ErrorAction SilentlyContinue | Stop-Process -Force
          $first = (Get-Item "$env:LOCALAPPDATA\Programs\Pacitum Browser\PacitumBrowser.exe" -ErrorAction SilentlyContinue).LastWriteTime
          "first install: exe present=$([bool]$first)  desktop shortcut=$(Test-Path "$env:USERPROFILE\Desktop\Pacitum Browser.lnk")" | Tee-Object installer-shots\upgrade-check.txt
          # 2) run the same installer again silently: must upgrade in place (same AppId → same dir, one uninstall entry)
          Start-Process $setup -ArgumentList '/VERYSILENT','/CURRENTUSER','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $keys = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '*FD3A16C9-4CF0-4B0B-BBEC-A5E3334D7CFE*' }
          $keys | ForEach-Object { $_ | Get-ItemProperty | Select-Object PSChildName, DisplayName, DisplayVersion, InstallLocation | Format-List | Out-String | Write-Host }
          "uninstall entries after re-install: $(@($keys).Count)" | Tee-Object -Append installer-shots\upgrade-check.txt
          Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -ErrorAction SilentlyContinue | Out-String | Tee-Object -Append installer-shots\upgrade-check.txt
          if (@($keys).Count -ne 1) { Write-Error "expected exactly one uninstall entry"; exit 1 }
          # 3) what the built-in updater does: silent upgrade with /RELAUNCH=1 must start the browser again
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/NORESTARTAPPLICATIONS','/RELAUNCH=1' -Wait
          $relaunched = $false
          for ($i = 0; $i -lt 40 -and -not $relaunched; $i++) { Start-Sleep -Milliseconds 500; $relaunched = [bool](Get-Process PacitumBrowser -ErrorAction SilentlyContinue) }
          "updater-style silent upgrade relaunched the browser: $relaunched" | Tee-Object -Append installer-shots\upgrade-check.txt
          Start-Sleep 3; Shot '5-relaunched'
          Get-Process PacitumBrowser -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: installer-screens, path: installer-shots/, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        with:
          name: PacitumBrowser-Setup
          path: installer/*.exe
